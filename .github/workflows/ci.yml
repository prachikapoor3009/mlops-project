#Defining github workflow for continuous integration

name: CI Train and Save the Model

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

#Defining the jobs to be run in the workflow
jobs:
  matrix-pip:
    name: Train and Save the Model
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install depedencies
        run: pip install -r requirements.txt

      - name: Train and Save the Model
        run: |
          python train.py
          ls -la artifacts
          

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-{{ matrix.python-version }}-${{ github.run_id }}
          path: artifacts
      



      